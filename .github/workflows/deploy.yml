name: CI / Deploy

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Unit tests
        run: pytest tests/unit -q

  deploy:
    name: Deploy to Nebius VM
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -euo pipefail

            echo "── Bootstrap: ensure repo exists ────────────"
            if [ ! -d ~/logtrace ]; then
              git clone ${{ github.server_url }}/${{ github.repository }}.git ~/logtrace
            fi
            cd ~/logtrace

            echo "── Pulling latest code ──────────────────────"
            git pull origin main

            echo "── Writing .env ─────────────────────────────"
            {
            echo "NEBIUS_API_KEY=${{ secrets.NEBIUS_API_KEY }}"
            echo "NEBIUS_BASE_URL=${{ secrets.NEBIUS_BASE_URL }}"
            echo "NANO_MODEL_ID=${{ secrets.NANO_MODEL_ID }}"
            echo "ULTRA_MODEL_ID=${{ secrets.ULTRA_MODEL_ID }}"
            echo "OBJECT_STORAGE_BUCKET=${{ secrets.OBJECT_STORAGE_BUCKET }}"
            echo "OBJECT_STORAGE_ENDPOINT=${{ secrets.OBJECT_STORAGE_ENDPOINT }}"
            echo "NEBIUS_STORAGE_ACCESS_KEY_ID=${{ secrets.NEBIUS_STORAGE_ACCESS_KEY_ID }}"
            echo "NEBIUS_STORAGE_SECRET_KEY=${{ secrets.NEBIUS_STORAGE_SECRET_KEY }}"
            echo "TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}"
            echo "DEMO_API_KEY=${{ secrets.DEMO_API_KEY }}"
            echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}"
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}"
            echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}"
            echo "DATABASE_URL=postgresql+asyncpg://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/${{ secrets.POSTGRES_DB }}"
            echo "REDIS_URL=redis://redis:6379/0"
            } > .env

            echo "── Building images ──────────────────────────"
            docker compose -f docker-compose.prod.yml build

            echo "── Running migrations ───────────────────────"
            docker compose -f docker-compose.prod.yml run --rm api alembic upgrade head

            echo "── Restarting services ──────────────────────"
            docker compose -f docker-compose.prod.yml up -d

            echo "── Done ─────────────────────────────────────"
            echo "Portal: http://${{ secrets.VM_HOST }}/portal"