services:

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      NEBIUS_API_KEY: ${NEBIUS_API_KEY}
      NEBIUS_BASE_URL: ${NEBIUS_BASE_URL}
      NANO_MODEL_ID: ${NANO_MODEL_ID}
      ULTRA_MODEL_ID: ${ULTRA_MODEL_ID}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT}
      NEBIUS_STORAGE_ACCESS_KEY_ID: ${NEBIUS_STORAGE_ACCESS_KEY_ID}
      NEBIUS_STORAGE_SECRET_KEY: ${NEBIUS_STORAGE_SECRET_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      DEMO_API_KEY: ${DEMO_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000

  stream_processor:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      NEBIUS_API_KEY: ${NEBIUS_API_KEY}
      NEBIUS_BASE_URL: ${NEBIUS_BASE_URL}
      NANO_MODEL_ID: ${NANO_MODEL_ID}
      ULTRA_MODEL_ID: ${ULTRA_MODEL_ID}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT}
      NEBIUS_STORAGE_ACCESS_KEY_ID: ${NEBIUS_STORAGE_ACCESS_KEY_ID}
      NEBIUS_STORAGE_SECRET_KEY: ${NEBIUS_STORAGE_SECRET_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      DEMO_API_KEY: ${DEMO_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: python -m stream_processor.processor

  streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      NEBIUS_API_KEY: ${NEBIUS_API_KEY}
      NEBIUS_BASE_URL: ${NEBIUS_BASE_URL}
      NANO_MODEL_ID: ${NANO_MODEL_ID}
      ULTRA_MODEL_ID: ${ULTRA_MODEL_ID}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT}
      NEBIUS_STORAGE_ACCESS_KEY_ID: ${NEBIUS_STORAGE_ACCESS_KEY_ID}
      NEBIUS_STORAGE_SECRET_KEY: ${NEBIUS_STORAGE_SECRET_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      DEMO_API_KEY: ${DEMO_API_KEY}
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: streamlit run streamlit_portal/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nemotrace.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  demo-producers:
    build:
      context: .
      dockerfile: demo/Dockerfile.producers
    environment:
      INGEST_URL: http://api:8000/api/v1/ingest
      DEMO_API_KEY: ${DEMO_API_KEY}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      api:
        condition: service_healthy
    command: python -m demo.producers.run_demo
    profiles:
      - demo

volumes:
  postgres_data:
  redis_data:
