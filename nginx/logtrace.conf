server {
    listen 80;
    server_name _;

    # Use Docker's internal DNS — resolves service names lazily at request time
    # so nginx doesn't crash on startup if 'api' container isn't ready yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 110m;

    # Health check
    location /health {
        set $upstream http://api:8000;
        proxy_pass $upstream/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SSE stream endpoints — disable buffering, extended timeout for Ultra 253B
    location /api/v1/submissions {
        set $upstream http://api:8000;
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        add_header X-Accel-Buffering no;
        chunked_transfer_encoding on;
    }

    # Demo endpoints
    location /demo/ {
        set $upstream http://api:8000;
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API
    location /api/ {
        set $upstream http://api:8000;
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Swagger docs
    location /docs {
        set $upstream http://api:8000;
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        set $upstream http://api:8000;
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
    }

    # Portal HTML — never cache so new asset hashes always load
    location = /portal/ {
        set $upstream http://api:8000;
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Portal static assets (JS/CSS) — long cache, filenames are hashed
    location /portal/ {
        set $upstream http://api:8000;
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Redirect root to portal
    location = / {
        return 301 /portal/;
    }
}