server {
    listen 80;
    server_name _;

    # Use Docker's internal DNS — resolves service names lazily at request time
    # so nginx doesn't crash if a container isn't up yet at startup.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api api:8000;

    client_max_body_size 110m;

    # Health check
    location /health {
        proxy_pass http://$api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SSE stream endpoints — must disable buffering or events stall
    # proxy_read_timeout extended: Ultra 253B RCA can stream for several minutes
    location /api/v1/submissions {
        proxy_pass http://$api/api/v1/submissions;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        add_header X-Accel-Buffering no;
        chunked_transfer_encoding on;
    }

    # Demo endpoints
    location /demo/ {
        proxy_pass http://$api/demo/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API
    location /api/ {
        proxy_pass http://$api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Swagger docs
    location /docs {
        proxy_pass http://$api/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://$api/openapi.json;
        proxy_set_header Host $host;
    }

    # Portal
    location /portal/ {
        proxy_pass http://$api/portal/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Redirect root to portal
    location = / {
        return 301 /portal/;
    }
}